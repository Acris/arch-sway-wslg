# =============================================================================
# Foot / Catppuccin Mocha
# =============================================================================

[main]
font=Maple Mono NF CN:size=12,Noto Color Emoji:size=12
dpi-aware=no
initial-color-theme=dark
pad=14x12

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

# Catppuccin Mocha (official Foot palette)
[colors-dark]
alpha=0.98
cursor=11111b f5e0dc
foreground=cdd6f4
background=1e1e2e
regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=bac2de
bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=f5c2e7
bright6=94e2d5
bright7=a6adc8
16=fab387
17=f5e0dc
selection-foreground=cdd6f4
selection-background=414356
search-box-no-match=11111b f38ba8
search-box-match=cdd6f4 313244
jump-labels=11111b fab387
urls=89b4fa

# =============================================================================
# Local overrides
# =============================================================================
# local.ini is yours: the installer creates it once and never replaces it.
# It is read last, so every option it sets wins.
[main]
include=__ARCH_SWAY_WSLG_FOOT_LOCAL__
