# =============================================================================
# Fuzzel / Catppuccin Mocha
# UI: Sarasa UI SC | Nerd glyph fallback: Maple Mono NF CN
# =============================================================================

# Sizes and paddings are Fuzzel's own defaults; only the font, the theme, and
# the behaviour below are set.
[main]
font=Sarasa UI SC:size=12,Maple Mono NF CN:size=12,Noto Color Emoji:size=12
terminal=foot {cmd}
layer=overlay
prompt="  "
placeholder=Search applications...
icon-theme=Papirus-Dark
icons-enabled=yes
filter-desktop=yes
use-bold=yes
# Fuzzel's default is `auto`, which would size the font from the monitor DPI
# instead of the Sway output scale.
dpi-aware=no

[colors]
background=1e1e2ef5
text=cdd6f4ff
prompt=bac2deff
placeholder=7f849cff
input=cdd6f4ff
match=cba6f7ff
selection=585b70ff
selection-text=cdd6f4ff
selection-match=cba6f7ff
counter=7f849cff
border=cba6f7ff

# =============================================================================
# Local overrides
# =============================================================================
# local.ini is yours: the installer creates it once and never replaces it.
# It is read last, so every option it sets wins.
[main]
include=__ARCH_SWAY_WSLG_FUZZEL_LOCAL__
