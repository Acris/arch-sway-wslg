# =============================================================================
# Fuzzel / Catppuccin Mocha
# UI: Sarasa UI SC | Nerd glyph fallback: Maple Mono NF CN
# =============================================================================

[main]
font=Sarasa UI SC:size=13,Maple Mono NF CN:size=13,Noto Color Emoji:size=13
terminal=foot {cmd}
layer=overlay
prompt="  "
placeholder=Search applications...
icon-theme=Papirus-Dark
icons-enabled=yes
filter-desktop=yes
use-bold=yes
width=42
lines=8
horizontal-pad=22
vertical-pad=14
inner-pad=10
dpi-aware=no

[border]
width=2
radius=16
selection-radius=10

[colors]
background=1e1e2ef5
text=cdd6f4ff
prompt=bac2deff
placeholder=7f849cff
input=cdd6f4ff
match=cba6f7ff
selection=585b70ff
selection-text=cdd6f4ff
selection-match=cba6f7ff
counter=7f849cff
border=cba6f7ff

# =============================================================================
# Local overrides
# =============================================================================
# local.ini is yours: the installer creates it once and never replaces it.
# It is read last, so every option it sets wins.
[main]
include=__ARCH_SWAY_WSLG_FUZZEL_LOCAL__
