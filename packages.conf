# Providers and shared prerequisites installed before the desktop stack.
[bootstrap]
xdg-desktop-portal-gtk-dummy
noto-fonts
# Default JACK provider; install.sh skips it when pipewire-jack is installed.
jack2
# Maple Mono contains Nerd Font glyphs, but its AUR package does not declare
# the ttf-font-nerd virtual provider required by Arch's yazi package.
ttf-nerd-fonts-symbols-mono

# Remaining top-level packages.
[main]
# Desktop stack:
sway
xorg-xwayland
swaybg
waybar
swaync
foot
fuzzel
nwg-look
qt5-wayland

# Top-level terminal file manager:
yazi

# Credential storage and management. install.sh skips oo7 when an
# org.freedesktop.secrets provider is already installed.
oo7
seahorse

# Appearance:
adw-gtk-theme
papirus-icon-theme
ttf-sarasa-gothic
maplemono-nf-cn-unhinted
noto-fonts-emoji

# WSLg clipboard integration:
wl-clipboard
